# Minimal non-root development configuration.
# The daemon creates private state with mode 0700. Prepare the runtime directory
# before starting: mkdir -p -m 0700 /tmp/piqueld-dev-run
# just dev handles this setup automatically. Existing directories are validated,
# never chmodded. The Unix socket is always 0660; this private runtime directory
# keeps development access limited to your user.

[server]
# Private development state and a separate runtime directory.
data_dir = "/tmp/piqueld-dev"
runtime_dir = "/tmp/piqueld-dev-run"
listen_mode = "both"
port = 7845
# Add exact trusted DNS names when using a hostname instead of a literal IP.
allowed_hosts = []

[auth]
# Defaults to the tailnet node's HTTPS URL when [tailscale] is enabled, and to
# http://localhost:7845 otherwise. Other HTTPS origins need external TLS.
# public_url = "https://piqueld.example"

[tailscale]
# Join the tailnet as piqueld-dev.<tailnet>.ts.net and serve HTTPS on its port
# 443 through a dedicated tailscaled, which must be on PATH with the tailscale
# CLI. Node state lives in <data_dir>/tailscale. Without an auth key, the daemon
# logs a login URL and waits. The tailnet must have HTTPS certificates enabled.
enabled = false
hostname = "piqueld-dev"
# auth_key_file = "/tmp/piqueld-dev-ts-auth-key"
# Node port serving HTTPS.
# https_port = 443
# Share a logged-in tailscaled, running as the daemon's user, instead of
# starting one; piqueld then only adds https_port to its Serve configuration.
# socket = "/tmp/piqueld-dev/tailnet/tailscaled.sock"

[docker]
socket = "/var/run/docker.sock"
auto_initialize_swarm = true

[ingress]
# Requires Docker 28+ and free public ports 80/443, unless [ingress.tunnel] is
# enabled. Restart to apply.
enabled = false
# This server's public addresses. Where a DNS provider sets manage_records,
# direct public routes get A/AAAA records to them; without any, those records
# stay manual. Unused in tunnel mode.
public_addresses = []

# Private routes, served to the tailnet through a second tailnet node, the apps
# node: a Tailscale container beside the gateway, named
# piqueld-apps.<tailnet>.ts.net. Its state lives in <data_dir>/ingress/tailscale.
# Without an auth key, the daemon logs a login URL. Private routes need DNS-01
# certificates, so configure [[dns.providers]] for their zones. Restart to apply.
[ingress.private]
enabled = false
hostname = "piqueld-apps"
# auth_key_file = "/tmp/piqueld-dev-ts-apps-auth-key"

# Public routes through a locally managed Cloudflare Tunnel instead of ports
# 80/443, which are then closed. The credentials file comes from
# `cloudflared tunnel create piqueld`. Each public hostname needs a proxied CNAME
# to <tunnel-id>.cfargotunnel.com. Restart to apply.
[ingress.tunnel]
enabled = false
# credentials_file = "/tmp/piqueld-dev-cloudflared-tunnel.json"

# ACME account for certificates piqueld issues itself through DNS-01.
[ingress.acme]
directory = "https://acme-v02.api.letsencrypt.org/directory"
# email = "admin@example.com"

# DNS provider accounts used for DNS-01 and, with manage_records, routes'
# A/AAAA/CNAME records. Credentials are only read from files; relative paths
# resolve against $CREDENTIALS_DIRECTORY.
# [[dns.providers]]
# kind = "cloudflare"
# api_token_file = "/tmp/piqueld-dev-cloudflare-token" # Zone:Read and DNS:Edit
# manage_records = false
#
# [[dns.providers]]
# kind = "ovh"
# endpoint = "ovh-eu"
# application_key_file = "/tmp/piqueld-dev-ovh-application-key"
# application_secret_file = "/tmp/piqueld-dev-ovh-application-secret"
# consumer_key_file = "/tmp/piqueld-dev-ovh-consumer-key"

[reconciliation]
scan_interval_seconds = 60
prepare_timeout_seconds = 300
convergence_timeout_seconds = 120

[retention]
finished_operation_days = 10
event_days = 90
daemon_event_days = 90

[build_history]
# Metadata remains until application deletion; these limits apply only to output.
log_max_bytes = 4194304
log_retention_days = 30

# Metrics have a separate listener with no administrative API routes.
[metrics]
listen = [] # Example: ["127.0.0.1:7846"]

[notifications]
enabled = false
build_failures = true
deployment_failures = true
service_degradation = true
daemon_failures = true
recovery = true
security = true
failure_threshold_seconds = 120
retry_window_seconds = 86400
# URLs can contain credentials: use `url_file` instead of `url` to keep them
# out of this file. Relative paths resolve against $CREDENTIALS_DIRECTORY.
# [[notifications.destinations]]
# name = "admins"
# url_file = "/run/credentials/piqueld.service/admins-webhook"
# kind = "json" # or "discord"
# enabled = true
