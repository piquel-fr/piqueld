# OpenTelemetry Collector 0.163: receives the daemon's telemetry on its socket
# and other applications' over OTLP, and stores metrics in Prometheus, traces in
# Tempo and logs in Loki.
receivers:
  otlp/piqueld:
    protocols:
      grpc:
        endpoint: /run/piqueld/telemetry/otlp.sock
        transport: unix
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

exporters:
  otlp_http/prometheus:
    metrics_endpoint: http://prometheus:9090/api/v1/otlp/v1/metrics
    sending_queue:
      batch: {}
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    sending_queue:
      batch: {}
  otlp_http/loki:
    logs_endpoint: http://loki:3100/otlp/v1/logs
    sending_queue:
      batch: {}

extensions:
  health_check:
    endpoint: 127.0.0.1:13133

service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [otlp/piqueld, otlp]
      processors: [memory_limiter]
      exporters: [otlp_http/prometheus]
    traces:
      receivers: [otlp/piqueld, otlp]
      processors: [memory_limiter]
      exporters: [otlp_grpc/tempo]
    logs:
      receivers: [otlp/piqueld, otlp]
      processors: [memory_limiter]
      exporters: [otlp_http/loki]
