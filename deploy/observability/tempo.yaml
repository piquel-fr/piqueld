# Tempo 3.1, monolithic: receives traces from the collector over OTLP/gRPC and
# keeps them for 7 days. Span metrics, with exemplars, go to Prometheus.
stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

metrics_generator:
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    compaction:
      block_retention: 168h
    metrics_generator:
      processors: [span-metrics]

usage_report:
  reporting_enabled: false
