# The documentation book at https://docs.piqueld.dev. Each deployment reads
# this file from main, and every push to main deploys it. See
# docs/dev/publishing.md.
api_version = "piqueld.dev/v1alpha1"
kind = "Application"

[metadata]
name = "docs"

[spec.manifest]
path = "deploy/docs/piqueld.toml"
sync = { mode = "webhook" }

[spec.manifest.repository]
url = "https://github.com/piquel-fr/piqueld.git"
branch = "main"

[spec.environments.production]
sync = true

[[spec.services]]
name = "web"

[spec.services.source]
type = "git"
repository = "self"

[spec.services.source.build]
type = "docker"
dockerfile = "deploy/docs/Dockerfile"

# static-web-server uses a few MiB serving static files.
[spec.services.resources]
cpu_millis = 500
memory_bytes = 67108864 # 64 MiB

[spec.services.healthcheck]
type = "http"
port = 80
path = "/"

[[spec.routes]]
name = "web"
hostname = "docs.piqueld.dev"
service = "web"
port = 80
visibility = "public"
