# piqueld.dev's websites, as one application: the marketing site at
# piqueld.dev and the documentation at docs.piqueld.dev. Each deployment reads
# this file, and the files its services build, from main, and every push to
# main deploys it. Each preview serves a branch's site and docs on the tailnet,
# below preview.piqueld.dev. Add a site with its own service, route and
# hostname variable. The telemetry stack is its own application, in
# deploy/piqueld-observability.toml. See docs/dev/publishing.md.
api_version = "piqueld.dev/v1alpha1"
kind = "Application"

[metadata]
name = "piqueld-dev"

[spec.manifest]
path = "deploy/piqueld-dev.toml"
sync = { mode = "webhook" }

[spec.manifest.repository]
url = "https://github.com/sourceorigin-dev/piqueld.git"
branch = "main"

[spec.environments.production]
sync = true

[spec.variables]
site_hostname = "piqueld.dev"
docs_hostname = "docs.piqueld.dev"
www_hostname = "www.piqueld.dev"

# Previews' routes are private, and their flat hostnames share the
# *.preview.piqueld.dev certificate: piqueld-dev-feat-x-3fa2c1.preview.piqueld.dev
# for the site, with docs- and www- in front for the others.
[spec.previews.variables]
site_hostname = "${{ env.slug }}.preview.piqueld.dev"
docs_hostname = "docs-${{ env.slug }}.preview.piqueld.dev"
www_hostname = "www-${{ env.slug }}.preview.piqueld.dev"

# The documentation book, built from deploy/docs/Dockerfile at the deployed
# commit.
[[spec.services]]
name = "docs"

[spec.services.source]
type = "git"
repository = "self"

[spec.services.source.build]
type = "docker"
dockerfile = "deploy/docs/Dockerfile"

# static-web-server uses a few MiB serving static files.
[spec.services.resources]
cpu_millis = 500
memory_bytes = 67108864 # 64 MiB

[spec.services.healthcheck]
type = "http"
port = 8080
path = "/"

[[spec.routes]]
name = "docs"
hostname = "${{ vars.docs_hostname }}"
service = "docs"
port = 8080
visibility = "public"

# The marketing site, apps/site, served from deploy/site/Dockerfile at the
# deployed commit.
[[spec.services]]
name = "site"

[spec.services.source]
type = "git"
repository = "self"

[spec.services.source.build]
type = "docker"
dockerfile = "deploy/site/Dockerfile"

[spec.services.resources]
cpu_millis = 500
memory_bytes = 67108864 # 64 MiB

[spec.services.healthcheck]
type = "http"
port = 8080
path = "/"

[[spec.routes]]
name = "site"
hostname = "${{ vars.site_hostname }}"
service = "site"
port = 8080
visibility = "public"

[[spec.routes]]
name = "www"
hostname = "${{ vars.www_hostname }}"
redirect = { to = "https://${{ vars.site_hostname }}" }
visibility = "public"

