[package]
name = "piqueld-probe"
description = "Static in-container HTTP health probe for piqueld services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories = ["command-line-utilities"]
# Only for its build script's metadata: `piqueld-docker`'s build script reads this
# crate's directory from `DEP_PIQUELD_PROBE_DIR` and builds the binary there,
# so it works from the published crates as from the workspace.
links = "piqueld_probe"

# The daemon embeds the binary and Swarm mounts it into images that may lack a
# C library or dynamic loader, so it must stay dependency-light and small. The
# `piqueld-docker` build script builds it statically, for a `*-unknown-linux-musl`
# target with the `probe` profile of `crates/piqueld-docker/build/probe.toml`.
[dependencies]
thiserror.workspace = true

[lints]
workspace = true
