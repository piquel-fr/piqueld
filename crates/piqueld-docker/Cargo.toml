[package]
name = "piqueld-docker"
description = "Docker Engine and Swarm boundary of the piqueld daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories = ["api-bindings"]
include = ["/build.rs", "/build", "/src", "/LICENSE"]

# `fake` adds the in-memory Docker engine (`piqueld_docker::fake`) of the
# daemon's tests and browser fixture. Release builds leave it out.
[features]
fake = []

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
bollard.workspace = true
bytes.workspace = true
futures-util.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
parking_lot.workspace = true
piqueld-core.workspace = true
piqueld-probe.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

# The build script builds the health probe it embeds with a nested Cargo.
[build-dependencies]
piqueld-build.workspace = true

[lints]
workspace = true
