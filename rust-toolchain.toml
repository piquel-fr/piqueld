[toolchain]
# Pinned, so rustup, CI, and the Nix packages build with the same Rust.
channel = "stable"
# llvm-tools: the llvm-cov and llvm-profdata `just coverage` reads profiles with.
components = [ "rustfmt", "clippy", "llvm-tools" ]
targets = [
    "wasm32-unknown-unknown",
    # The static health probe the daemon embeds.
    "x86_64-unknown-linux-musl",
]
