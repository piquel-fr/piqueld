[workspace]
resolver = "3"
members = [
  "apps/piqueld",
  "apps/piquelctl",
  "apps/piqueld-ui",
  "crates/piqueld-client",
  "crates/piqueld-core",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/piquel-fr/piqueld"
rust-version = "1.96"

[workspace.dependencies]
# Internal
piqueld-client = { version = "0.1.0", path = "crates/piqueld-client" }
piqueld-core   = { version = "0.1.0", path = "crates/piqueld-core"   }

# External
anyhow = "1.0.98"
async-trait = "0.1.88"
axum = { version = "0.8.4", features = ["json", "tokio", "http1"] }
base64 = "0.22.1"
bytes = "1.10.1"
chacha20poly1305 = "0.10.1"
bollard = "0.19.1"
clap = { version = "4.5.40", features = ["derive"] }
futures-util = "0.3.31"
gix = { version = "0.80.0", default-features = false, features = ["basic", "blocking-http-transport-reqwest-rust-tls", "worktree-mutation"] }
globset = "0.4.16"
http = "1.3.1"
http-body-util = "0.1.3"
hyper = { version = "1.6.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.14", features = ["tokio"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
rustix = { version = "1.1.4", features = ["fs", "process"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_path_to_error = "0.1.17"
sha2 = "0.10.9"
subtle = "2.6.1"
tar = "0.4.44"
sqlx = { version = "0.8.6", default-features = false, features = ["macros", "runtime-tokio", "sqlite"] }
tempfile = "3.20.0"
thiserror = "2.0.12"
tokio = { version = "1.45.1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.15", features = ["rt"] }
toml = "0.8.22"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt", "json"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.6", features = ["fs", "request-id", "trace"] }
utoipa = { version = "5.3.1", features = ["axum_extras", "uuid"] }
utoipa-axum = "0.2.0"
url = "2.5.4"
uuid = { version = "1.17.0", features = ["v7"] }
walkdir = "2.5.0"
zeroize = "1.8.1"

# Browser UI and same-origin WASM transport. These are target-gated in the
# client/UI crates so native daemon and CLI builds do not link browser code.
gloo-net = { version = "0.6.0", default-features = false }
gloo-timers = "0.3.0"
leptos = { version = "0.6.15", default-features = false }
web-sys = "=0.3.103"

proptest = "1.6.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
strip = "symbols"
