# A hung test fails with a report instead of stalling validation indefinitely.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }

# Real image builds and Swarm convergence are bounded by scripts/run-docker-integration-test.sh.
[[profile.default.overrides]]
filter = "binary(docker_integration)"
slow-timeout = { period = "60s" }

# Emit structured results for local runs as well as CI artifacts.
[profile.default.junit]
path = "junit.xml"

[profile.ci]
fail-fast = false

[profile.ci.junit]
report-name = "piqueld-workspace"

[profile.docker-ci]
fail-fast = false

[profile.docker-ci.junit]
report-name = "piqueld-docker-integration"
