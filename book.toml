# The documentation book, published at docs.piqueld.dev. `just docs` builds and
# checks it, `just docs-serve` previews it. See docs/dev/documentation.md.

[book]
title = "piqueld"
description = "A Rust control plane for a single-node Docker Swarm."
language = "en"
src = "docs"

[build]
build-dir = "target/book"
# A page listed in SUMMARY.md but missing fails the build.
create-missing = false

[output.html]
site-url = "/"
# Chapters are grouped into the user and developer guides, not numbered.
no-section-label = true
git-repository-url = "https://github.com/piquel-fr/piqueld"
edit-url-template = "https://github.com/piquel-fr/piqueld/edit/main/{path}"
