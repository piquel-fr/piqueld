[package]
name = "piquelctl"
default-run = "piquelctl"
description = "Command-line client for piqueld, a control plane for a single-node Docker Swarm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories = ["command-line-utilities"]
# The tests and the `cli_reference` example read files from across the
# repository, so the published crate leaves them out.
include = ["/src", "/LICENSE"]

[dependencies]
anstream.workspace = true
tempfile.workspace = true
indicatif.workspace = true
parking_lot.workspace = true
clap.workspace = true
# `piquelctl completions` shell scripts.
clap_complete.workspace = true
futures-util.workspace = true
http.workspace = true
piqueld-client.workspace = true
# Raw mode and window size for `app exec --tty`.
rustix = { workspace = true, features = ["termios"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["io-std"] }
uuid.workspace = true
# Display widths of human table cells.
unicode-width.workspace = true

[lints]
workspace = true

[dev-dependencies]
# The `cli_reference` example writes the command reference through it.
piqueld-generated.workspace = true
tempfile.workspace = true
# Serves exec WebSockets from the blocking test server.
tokio-tungstenite.workspace = true
