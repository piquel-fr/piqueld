[package]
name = "piqueld"
description = "Control plane for a single-node Docker Swarm: deployments, HTTPS routes, secrets and more"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "web-programming::http-server"]
# The published crate leaves out the tests and examples, which read files from
# across the repository. `dashboard/` is the prebuilt dashboard
# `cargo xtask publish` ships; see `build/dashboard.rs`.
include = ["/build.rs", "/build", "/dashboard", "/src", "/LICENSE"]

# `embedded-ui` builds the dashboard from `apps/piqueld-ui` and embeds it, so
# it works only in a checkout of the repository. The build script compiles it
# with a nested Cargo, so the wasm32-unknown-unknown target (listed in
# rust-toolchain.toml) must be installed. The published crate embeds the
# prebuilt bundle it ships instead, without the feature.
[features]
embedded-ui = ["dep:wasm-bindgen-cli-support"]
# The in-memory Docker engine (`piqueld_docker::fake`) of the integration
# tests and the browser fixture, and `Store::open_unsynced` for their
# throwaway stores. It only adds API: the daemon's store syncs regardless.
# Release builds leave it out.
fake-docker = ["piqueld-docker/fake", "piqueld-store/testing"]

[dependencies]
zeroize.workspace = true
anyhow.workspace = true
base64.workspace = true
getrandom.workspace = true
instant-acme.workspace = true
openssl.workspace = true
parking_lot.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-proto.workspace = true
opentelemetry-appender-tracing.workspace = true
tracing-opentelemetry.workspace = true
tonic.workspace = true
url.workspace = true
webauthn-rs-core.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = ["ws"] }
bollard.workspace = true
clap.workspace = true
futures-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http.workspace = true
http-body-util.workspace = true
piqueld-config.workspace = true
piqueld-core.workspace = true
piqueld-docker.workspace = true
piqueld-store.workspace = true
rustix.workspace = true
reqwest = { workspace = true, features = ["rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
sqlx.workspace = true
sha2.workspace = true
thiserror.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tower.workspace = true
tower-http.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
uuid.workspace = true
x509-parser.workspace = true

# musl builds, such as the static release binaries of `cargo xtask dist`,
# build OpenSSL from source and link it statically: musl hosts rarely have a
# static OpenSSL to link.
[target.'cfg(target_env = "musl")'.dependencies]
openssl = { workspace = true, features = ["vendored"] }

[dev-dependencies]
# Tests and examples build against this crate with its fake Docker engine.
piqueld = { path = ".", features = ["fake-docker"] }
reqwest = { workspace = true, features = ["http2"] }
tokio = { workspace = true, features = ["test-util"] }
piqueld-client.workspace = true
# The ingress tests' DNS providers, and the resolver checking their records.
piqueld-config = { workspace = true, features = ["testing"] }
hickory-resolver.workspace = true
# Store fixtures for the unit tests.
piqueld-store = { workspace = true, features = ["testing"] }
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
# Drives exec WebSockets frame by frame.
tokio-tungstenite.workspace = true
# The `generate_openapi` example, which `just generate` runs.
piqueld-generated.workspace = true
prettyplease.workspace = true
progenitor.workspace = true
syn.workspace = true

[build-dependencies]
piqueld-build.workspace = true
sha2.workspace = true
wasm-bindgen-cli-support = { workspace = true, optional = true }

[lints]
workspace = true

[[example]]
name = "browser_fixture"
required-features = ["embedded-ui"]
