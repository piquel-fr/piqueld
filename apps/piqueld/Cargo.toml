[package]
name = "piqueld"
description = "The piqueld control-plane daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Builds with this feature embed the Trunk dashboard bundle at compile time.
# The build script invokes tailwindcss and trunk, so these tools plus the
# wasm32-unknown-unknown target must be available when it is enabled.
[features]
embedded-ui = []
openapi-codegen = ["dep:prettyplease", "dep:progenitor", "dep:syn"]

[[bin]]
name = "generate_openapi"
path = "src/bin/generate_openapi.rs"
required-features = ["openapi-codegen"]

[dependencies]
base64.workspace = true
chacha20poly1305.workspace = true
zeroize.workspace = true
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
bollard.workspace = true
clap.workspace = true
futures-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http.workspace = true
http-body-util.workspace = true
piqueld-core.workspace = true
prettyplease = { workspace = true, optional = true }
progenitor = { workspace = true, optional = true }
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
sqlx.workspace = true
sha2.workspace = true
thiserror.workspace = true
syn = { workspace = true, optional = true }
tempfile.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tower.workspace = true
tower-http.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
piqueld-client.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true

[build-dependencies]
tokio.workspace = true
sqlx.workspace = true
sha2.workspace = true

[lints]
workspace = true
