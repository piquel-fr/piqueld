[package]
name = "piqueld"
description = "The piqueld control-plane daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Builds with this feature embed the dashboard bundle at compile time. The
# build script compiles `piqueld-ui` with a nested Cargo, so the
# wasm32-unknown-unknown target (listed in rust-toolchain.toml) must be installed.
#
# The tailscale feature embeds a Go tsnet node through libtailscale, so builds
# with it need a Go toolchain. Builds without it reject `tailscale.enabled`.
[features]
embedded-ui = ["dep:wasm-bindgen-cli-support"]
tailscale = ["dep:libtailscale", "dep:tokio-rustls", "dep:x509-parser"]
openapi-codegen = ["dep:prettyplease", "dep:progenitor", "dep:syn"]

[[bin]]
name = "generate_openapi"
path = "src/bin/generate_openapi.rs"
required-features = ["openapi-codegen"]

[dependencies]
chacha20poly1305.workspace = true
zeroize.workspace = true
anyhow.workspace = true
base64.workspace = true
getrandom.workspace = true
openssl.workspace = true
url.workspace = true
webauthn-rs-core.workspace = true
async-trait.workspace = true
axum.workspace = true
bollard.workspace = true
clap.workspace = true
futures-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http.workspace = true
http-body-util.workspace = true
libtailscale = { workspace = true, optional = true }
piqueld-core.workspace = true
prettyplease = { workspace = true, optional = true }
progenitor = { workspace = true, optional = true }
rustix = { workspace = true, features = ["param"] }
reqwest = { workspace = true, features = ["rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
sqlx.workspace = true
sha2.workspace = true
thiserror.workspace = true
syn = { workspace = true, optional = true }
tempfile.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-rustls = { workspace = true, optional = true }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tower.workspace = true
tower-http.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
uuid.workspace = true
x509-parser = { workspace = true, optional = true }

[dev-dependencies]
reqwest = { workspace = true, features = ["http2"] }
tokio = { workspace = true, features = ["test-util"] }
piqueld-client.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true

[build-dependencies]
tokio.workspace = true
sqlx.workspace = true
sha2.workspace = true
wasm-bindgen-cli-support = { workspace = true, optional = true }

[lints]
workspace = true

[[example]]
name = "browser_fixture"
required-features = ["embedded-ui"]
