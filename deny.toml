[advisories]
unmaintained = "workspace"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Duplicates below are pinned by transitive dependencies (rand_core 0.6/ring,
# indexmap under the Leptos 0.8 reactive crates, asn1-rs and gloo-net) and by
# clap's move to syn 3. They cannot converge until those crates publish
# releases against the newer majors; skip the legacy side of each pair.
skip = [
  { crate = "getrandom@0.2.17", reason = "pinned by rand_core 0.6 and ring" },
  { crate = "hashbrown@0.17.1", reason = "pulled by indexmap 2.x under reactive_graph/tachys; sqlx-core pins hashbrown 0.15 via hashlink until it updates" },
  { crate = "syn@2.0.119", reason = "clap_derive moved to syn 3 while leptos_macro still requires syn 2" },
  { crate = "thiserror@1.0.69", reason = "asn1-rs (webauthn) and gloo-net still require thiserror 1" },
  { crate = "thiserror-impl@1.0.69", reason = "companion of the thiserror 1 pin above" },
]

[licenses]
confidence-threshold = 0.8
# Native HTTPS uses rustls/ring and Mozilla root-certificate data, and Leptos
# 0.8 always links wasm_split_macros (base16, public-domain CC0). Keep these
# additional licenses scoped to the dependencies that require them.
exceptions = [
  { crate = "base16", allow = ["CC0-1.0"] },
  { crate = "ring", allow = ["ISC"] },
  { crate = "rustls-webpki", allow = ["ISC"] },
  { crate = "untrusted", allow = ["ISC"] },
  { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
]
allow = [
  "Apache-2.0",
  "BSL-1.0",
  "BSD-3-Clause",
  # Rustls cryptography (ring/webpki/untrusted) and the Mozilla root certificate dataset.
  "ISC",
  "CDLA-Permissive-2.0",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[sources]
unknown-git = "deny"
unknown-registry = "deny"
