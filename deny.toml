[advisories]
unmaintained = "workspace"

[bans]
multiple-versions = "warn"
wildcards = "deny"
skip = [
  { crate = "thiserror@1.0.69", reason = "gloo-net 0.6 still depends on thiserror 1" },
  { crate = "thiserror-impl@1.0.69", reason = "implementation crate paired with gloo-net's thiserror 1" },
]

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[sources]
unknown-git = "deny"
unknown-registry = "deny"
