name: Bug report
description: Something in piqueld doesn't work as documented.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: The steps, and the manifest or configuration involved, without secrets.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `piquelctl status`, or the commit you built.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation
      options:
        - NixOS module
        - cargo install
        - Built from a checkout
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and diagnostics
      description: The output of `piquelctl doctor`, and the daemon's logs around the problem.
      render: text
