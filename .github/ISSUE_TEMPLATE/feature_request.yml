name: Feature request
description: Suggest something piqueld should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The problem or use case, rather than a solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could work, through the dashboard, piquelctl, and the manifest.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today
      description: Workarounds or other tools you use instead.
