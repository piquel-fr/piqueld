name: Install dashboard tooling
description: Installs everything the embedded-dashboard build script needs Trunk, wasm-bindgen-cli, Tailwind, binaryen, and the wasm32 Rust target.
inputs:
  trunk-version:
    description: Trunk release version to download.
    required: true
  tailwindcss-version:
    description: Tailwind CSS standalone CLI release version to download.
    required: true
  tailwindcss-sha256:
    description: Trusted SHA-256 for the selected tailwindcss-linux-x64 release asset.
    required: true
  binaryen-version:
    description: Binaryen release version providing wasm-opt. Ubuntu's package is too old for the flags Trunk passes.
    required: true
runs:
  using: composite
  steps:
    - name: Add the wasm32 target
      run: rustup target add wasm32-unknown-unknown
      shell: bash
    - name: Install the matching wasm-bindgen tools
      run: bash scripts/install-wasm-tools.sh
      shell: bash
    - name: Download pinned tools
      env:
        TAILWINDCSS_SHA256: ${{ inputs.tailwindcss-sha256 }}
      run: |
        set -euo pipefail
        temp="${RUNNER_TEMP:?}"
        bindir="$temp/piqueld-tools/dashboard-${{ inputs.trunk-version }}-${{ inputs.tailwindcss-version }}-${{ inputs.tailwindcss-sha256 }}-${{ inputs.binaryen-version }}"
        mkdir -p "$bindir"
        echo "$bindir" >> "$GITHUB_PATH"
        if [[ -x "$bindir/trunk" && -x "$bindir/tailwindcss" ]]; then
          exit 0
        fi

        fetch() {
          curl --fail --location --silent --show-error -o "$2" "$1"
        }
        fetch "https://github.com/trunk-rs/trunk/releases/download/v${{ inputs.trunk-version }}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
          "$temp/trunk.tar.gz"
        fetch "https://github.com/trunk-rs/trunk/releases/download/v${{ inputs.trunk-version }}/trunk-x86_64-unknown-linux-gnu.tar.gz.sha256" \
          "$temp/trunk.tar.gz.sha256"
        fetch "https://github.com/tailwindlabs/tailwindcss/releases/download/v${{ inputs.tailwindcss-version }}/tailwindcss-linux-x64" \
          "$bindir/tailwindcss"
        printf '%s  %s\n' "$TAILWINDCSS_SHA256" "$bindir/tailwindcss" \
          | sha256sum --check --strict -

        awk '{print $1 "  trunk.tar.gz"}' "$temp/trunk.tar.gz.sha256" \
          | (cd "$temp" && sha256sum --check --strict -)

        tar -xzf "$temp/trunk.tar.gz" -C "$bindir" trunk
        chmod +x "$bindir/tailwindcss" "$bindir/trunk"
      shell: bash
    - name: Install wasm-opt
      run: |
        set -euo pipefail
        temp="${RUNNER_TEMP:?}"
        bindir="$temp/piqueld-tools/dashboard-${{ inputs.trunk-version }}-${{ inputs.tailwindcss-version }}-${{ inputs.tailwindcss-sha256 }}-${{ inputs.binaryen-version }}"
        if [[ -x "$bindir/wasm-opt" ]]; then
          exit 0
        fi
        version="${{ inputs.binaryen-version }}"
        fetch() {
          curl --fail --location --silent --show-error -o "$2" "$1"
        }
        fetch "https://github.com/WebAssembly/binaryen/releases/download/version_${version}/binaryen-version_${version}-x86_64-linux.tar.gz" \
          "$temp/binaryen.tar.gz"
        fetch "https://github.com/WebAssembly/binaryen/releases/download/version_${version}/binaryen-version_${version}-x86_64-linux.tar.gz.sha256" \
          "$temp/binaryen.tar.gz.sha256"
        awk '{print $1 "  binaryen.tar.gz"}' "$temp/binaryen.tar.gz.sha256" \
          | (cd "$temp" && sha256sum --check --strict -)
        tar -xzf "$temp/binaryen.tar.gz" -C "$temp" \
          "binaryen-version_${version}/bin/wasm-opt"
        mv "$temp/binaryen-version_${version}/bin/wasm-opt" "$bindir/"
      shell: bash
