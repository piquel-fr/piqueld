# Continuous integration for piqueld.
#
# Jobs group the `just` validation recipes by what they compile, so each
# compilation happens once per job instead of once per recipe:
#
#   checks  -> fmt-check, deny
#   rust    -> lint, test, doc-test, openapi-check, boundary
#   msrv    -> the published crates on the Rust their `rust-version` names
#   wasm-ui -> ui-check, check-wasm, test-wasm
#   docker-integration -> docker-test, in three shards
#   browser-playwright -> test-playwright
#   cli (macOS)        -> validate-cli
#   nix                -> the combined Nix package
#   package            -> publish --dry-run
#   install            -> dist, then install.sh
#   docs               -> docs
#
# Pull requests run only the jobs whose inputs changed (see `changes`). Draft
# pull requests run only the quick jobs (checks, rust, msrv, wasm-ui): the slower
# ones (Docker, Playwright, macOS, Nix, packaging, install) wait until the pull request is marked
# ready, so iterating on a draft stays cheap. `docs` runs on every pull
# request, as its links point all over the repository and any change can
# break one. Merge queue entries, pushes to main and manual runs run
# everything, and build every Nix package: the queue tests each pull request on
# top of the latest main before it merges.
# `ci` is the single status to require: it fails if any job failed and passes
# when the rest succeeded or were skipped.
#
# Caches are saved from main only. Pull requests restore main's caches, so a
# branch never evicts them with copies no other branch can read.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts only bloat CI caches; restored dependency builds
  # make up for the lost reuse.
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: short
  NEXTEST_PROFILE: ci

jobs:
  # Decides which jobs a pull request needs from the paths it changes, and
  # holds the slow ones back while it is a draft. Each filter lists a job's
  # inputs, following the workspace dependency graph: piqueld-core <-
  # piqueld-client <- piquelctl, piqueld-ui, xtask, and the daemon embeds
  # piqueld-ui. Workspace-wide inputs run everything.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
      deny: ${{ github.event_name != 'pull_request' || steps.filter.outputs.deny == 'true' }}
      ui: ${{ github.event_name != 'pull_request' || steps.filter.outputs.ui == 'true' }}
      cli: ${{ github.event_name != 'pull_request' || (steps.filter.outputs.cli == 'true' && !github.event.pull_request.draft) }}
      docker: ${{ github.event_name != 'pull_request' || (steps.filter.outputs.docker == 'true' && !github.event.pull_request.draft) }}
      playwright: ${{ github.event_name != 'pull_request' || (steps.filter.outputs.playwright == 'true' && !github.event.pull_request.draft) }}
      nix: ${{ github.event_name != 'pull_request' || (steps.filter.outputs.nix == 'true' && !github.event.pull_request.draft) }}
      package: ${{ github.event_name != 'pull_request' || (steps.filter.outputs.package == 'true' && !github.event.pull_request.draft) }}
      install: ${{ github.event_name != 'pull_request' || (steps.filter.outputs.install == 'true' && !github.event.pull_request.draft) }}
    steps:
      - if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            workspace: &workspace
              - .github/workflows/**
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - .cargo/**
              - .config/**
              - justfile
            crates: &crates
              - *workspace
              - crates/**
            rust:
              - *crates
              - apps/**
              - tools/**
              - examples/**
              # A piqueld-core test loads piqueld.dev's manifest and its files.
              - deploy/**
              - .sqlx/**
              - rustfmt.toml
              # Generated by openapi-check.
              - docs/**/*.json
              - docs/user/reference/cli-commands.md
              - docs/user/reference/configuration-settings.md
              - docs/user/reference/manifest-settings.md
            deny:
              - *workspace
              - deny.toml
              - '**/Cargo.toml'
            ui:
              - *crates
              - apps/piqueld-ui/**
              - scripts/install-wasm-tools.sh
            cli:
              - *crates
              - apps/piquelctl/**
            docker:
              - *crates
              - apps/piqueld/**
              - tools/**
              - examples/**
              - scripts/**
            playwright:
              - *crates
              - apps/**
              - tools/**
              - examples/**
              - tests/playwright/**
              # The screenshot specs follow the guides.
              - docs/user/**
              - docs/images/**
            # The flake's package sources.
            nix:
              - *crates
              - flake.nix
              - flake.lock
              - nix/**
              - apps/**
              - tools/xtask/**
              - examples/**
            # What the published crates are packaged from.
            package:
              - *crates
              - apps/**
              - tools/xtask/**
              - README.md
              - LICENSE
            # What the release archive is built from, and the script that
            # installs it.
            install:
              - *crates
              - apps/piqueld/**
              - apps/piquelctl/**
              - apps/piqueld-ui/**
              - apps/site/install.sh
              - tools/xtask/**
              - LICENSE

  checks:
    name: checks
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.deny == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: just,cargo-deny
      - run: just fmt-check
      - run: just deny

  # Clippy runs first so lint failures report early; the embedded dashboard it
  # builds is then reused by the tests. `just lint` also lints the dashboard
  # and client as wasm32, using the target from rust-toolchain.toml.
  rust:
    name: rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: just,cargo-nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-directories: target-ui
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: just lint
      - run: just test
      - name: Preserve test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: junit-workspace
          path: target/nextest/ci/junit.xml
          retention-days: 7
          if-no-files-found: ignore
      - run: just doc-test
      - run: just openapi-check
      - run: just boundary

  # Builds the published crates, as `cargo install` and their dependents do,
  # with the oldest Rust the workspace's `rust-version` promises. Warnings
  # aren't errors here: lints differ between Rust versions, and `rust` lints
  # with the pinned one.
  msrv:
    name: msrv
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # RUSTUP_TOOLCHAIN overrides rust-toolchain.toml for every later step,
      # including the cache key and the daemon build script's nested build.
      - name: Install the minimum supported Rust
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal --target x86_64-unknown-linux-musl
          echo "RUSTUP_TOOLCHAIN=$msrv" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-directories: target-probe
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --locked --package piqueld --package piquelctl --package piqueld-client

  wasm-ui:
    name: wasm-ui
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-directories: ${{ runner.temp }}/piqueld-tools
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: bash scripts/install-wasm-tools.sh
      - run: just ui-check
      - run: just check-wasm
      # Ubuntu runners ship a matching Chrome and ChromeDriver pair.
      - name: Run browser transport tests
        run: CHROMEDRIVER="${CHROMEWEBDRIVER:?}/chromedriver" just test-wasm

  # Three shards, each against an engine of its own, so the serial suites run
  # side by side: the ingress suite, and the engine suite in two halves.
  # Each compiles only the test binary it runs.
  docker-integration:
    name: docker-integration (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ingress
            suite: ingress
            binary: --lib
          - name: engine 1/2
            suite: engine
            binary: --test docker_integration
            partition: --partition count:1/2
          - name: engine 2/2
            suite: engine
            binary: --test docker_integration
            partition: --partition count:2/2
    env:
      # `just docker-test` bounds each test run, within the job's timeout so
      # its cleanup and the test report still run; compilation is already
      # warm through the prebuild below.
      PIQUELD_DOCKER_TEST_TIMEOUT: 20m
      NEXTEST_PROFILE: docker-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: just,cargo-nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.suite }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Compile everything `just docker-test` runs before the isolated
      # Docker-in-Docker daemon starts, so its inner cargo invocations are
      # instant: the xtask runner and the shard's test binary.
      - name: Compile Docker integration tests
        run: |
          cargo build --locked --package xtask
          cargo nextest run --locked -p piqueld ${{ matrix.binary }} --no-run
      - name: Run Docker integration tests
        run: just docker-test ${{ matrix.suite }} ${{ matrix.partition }}
      - name: Preserve test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: junit-docker-integration-${{ strategy.job-index }}
          path: target/nextest/docker-ci/junit.xml
          retention-days: 7
          if-no-files-found: ignore

  browser-playwright:
    name: browser-playwright
    needs: changes
    if: needs.changes.outputs.playwright == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-directories: target-ui
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install pinned pnpm locally
        run: |
          npm install --prefix "$RUNNER_TEMP/piqueld-playwright-tools" pnpm@12.3.4
          echo "$RUNNER_TEMP/piqueld-playwright-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - run: just setup-playwright
      - run: pnpm --dir tests/playwright audit --audit-level=moderate
      - run: just test-playwright
      - name: Check documentation screenshots
        run: just docs-screenshots --update-snapshots=none
      - name: Preserve browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-playwright-report
          path: |
            tests/playwright/playwright-report/
            tests/playwright/test-results/
          retention-days: 7
          if-no-files-found: warn

  macos-cli:
    name: cli (macOS)
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: just,cargo-nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: just validate-cli

  # Builds the combined package. Crane's dependency builds are rooted with
  # out-links so the cache action's garbage collection keeps them; without
  # roots it deletes them, and every run rebuilds every dependency. Pull
  # requests only evaluate the other packages, which share these sources;
  # main and the merge queue build them too.
  nix:
    name: nix packages
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # Purges superseded Nix caches on main.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          # Keys are immutable, so each main build saves a fresh one; the
          # newest one with the same lockfiles restores first.
          primary-key: nix-x86_64-linux-${{ hashFiles('flake.nix', 'flake.lock', 'Cargo.lock') }}-${{ github.sha }}
          restore-prefixes-first-match: |
            nix-x86_64-linux-${{ hashFiles('flake.nix', 'flake.lock', 'Cargo.lock') }}-
            nix-x86_64-linux-
          save: ${{ github.ref == 'refs/heads/main' }}
          gc-max-store-size-linux: 4G
          # Only caches no run restored for a day: a failed save must not
          # purge the last usable cache.
          purge: ${{ github.ref == 'refs/heads/main' }}
          purge-prefixes: nix-x86_64-linux-
          purge-last-accessed: P1D
          purge-primary-key: never
      - name: Build Nix packages
        run: nix build -L .#default .#default.cargoArtifacts .#dashboard .#dashboard.cargoArtifacts
      - name: Build the other Nix packages
        run: nix build -L --out-link result-other ${{ github.event_name == 'pull_request' && '--dry-run' || '' }} .#cli .#cli.cargoArtifacts .#daemon

  # Packages every published crate, with the dashboard the daemon ships, and
  # builds each from its package, as `cargo install` would: everything
  # `just publish` does except uploading.
  package:
    name: package
    needs: changes
    if: needs.changes.outputs.package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-directories: |
            target-ui
            target-probe
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask publish --dry-run

  # Builds the release archive as the release workflow does, then installs it
  # with install.sh on the runner, which has systemd and Docker Engine like a
  # user's host. The script runs as the runner's user, as users run it, with
  # sudo for the steps that need root; --yes also adds that user to the
  # piqueld group. The second run is an update, which must leave the daemon
  # running too. The cache is shared with the release workflow's build.
  install:
    name: install
    needs: changes
    if: needs.changes.outputs.install == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install --yes --no-install-recommends musl-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: dist
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask dist
      - name: Install with install.sh, then update
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)
          for run in install update; do
            echo "::group::$run"
            PIQUELD_VERSION="$version" PIQUELD_RELEASE_URL="file://$PWD/target/dist" sh apps/site/install.sh --yes
            echo "::endgroup::"
          done
      - run: sudo piquelctl status
      # A member of the piqueld group reaches the daemon without an account to
      # print the setup link; sg runs it with the group the script added.
      - run: sg piqueld -c 'piquelctl setup-link'
      - name: Show the daemon's logs
        if: failure()
        run: sudo journalctl --unit piqueld --no-pager

  # Builds the documentation book and checks its links. The flake's `docs`
  # shell provides the tools at the versions flake.lock pins, as in
  # `nix develop`.
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nothing here pushes or fetches with the token.
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - run: nix develop .#docs --command just docs

  ci:
    name: ci
    if: always()
    needs:
      - changes
      - checks
      - rust
      - msrv
      - wasm-ui
      - docker-integration
      - browser-playwright
      - macos-cli
      - nix
      - package
      - install
      - docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: checks, rust, msrv, wasm-ui, docker-integration, browser-playwright, macos-cli, nix, package, install
          jobs: ${{ toJSON(needs) }}
