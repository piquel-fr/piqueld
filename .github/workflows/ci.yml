# Continuous integration for piqueld.
#
# Every `just` validation recipe runs as its own parallel job so the wall
# clock tracks the slowest check instead of their sum:
#
#   fmt-check         -> fmt
#   lint              -> clippy
#   test / doc-test   -> test
#   deny              -> deny
#   openapi-check     -> openapi
#   boundary          -> boundary
#   ui-check / check-wasm -> wasm-ui
#   docker-test       -> docker-integration
#   build-embedded    -> embedded-release
#   nix-check         -> nix
#
# `check` is deliberately not a separate job: `clippy --all-targets
# --all-features` compiles everything it would and adds lints on top.
#
# Nix validates package builds and their sandboxed tests on both supported
# native architectures. The KVM-dependent NixOS VM test runs only on x86_64.
# Each architecture restores its own Nix store cache.
#
# Speed comes from Swatinem/rust-cache in every compiling job (keyed per job
# against Cargo.lock), prebuilt tool downloads instead of `cargo install`,
# and incremental compilation disabled to keep caches small.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts only bloat CI caches; restored dependency builds
  # make up for the lost reuse.
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: short

jobs:
  fmt:
    name: fmt
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: just
      - run: just fmt-check

  clippy:
    name: lint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: just
      # --all-features compiles the embedded dashboard, which needs the same
      # tooling as a release build.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
          cache-directories: |
            target-ui
            ${{ runner.temp }}/piqueld-tools
      - uses: ./.github/actions/dashboard-tools
        with:
          trunk-version: "0.21.14"
          tailwindcss-version: "4.3.3"
          tailwindcss-sha256: "dc61b3ac6b8c9ca874c0cc4c57b2409791a64c5540404ca5f5367360babc313a"
          binaryen-version: "132"
      - run: just lint

  test:
    name: test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: just,cargo-nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
      - name: Run workspace tests
        env:
          NEXTEST_PROFILE: ci
        run: |
          rm -f target/nextest/ci/junit.xml
          just test
      - name: Preserve workspace test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: junit-workspace
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn
      - run: just doc-test

  deny:
    name: deny
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  openapi:
    name: openapi
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
      - run: just openapi-check

  boundary:
    name: boundary
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
      - run: just boundary

  wasm-ui:
    name: wasm-ui
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: just
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
          cache-directories: ${{ runner.temp }}/piqueld-tools
      - run: bash scripts/install-wasm-tools.sh
      - run: just ui-check
      - run: just check-wasm
      # Ubuntu runners ship a matching Chrome and ChromeDriver pair.
      - name: Run browser transport tests
        run: CHROMEDRIVER="${CHROMEWEBDRIVER:?}/chromedriver" just test-wasm

  docker-integration:
    name: docker-integration
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    env:
      # The wrapper bounds cargo invocation inside the script; compilation is
      # already warm through the prebuild below.
      PIQUELD_DOCKER_TEST_TIMEOUT: 30m
      NEXTEST_PROFILE: docker-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: just,cargo-nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
      # Compile before the isolated Docker-in-Docker daemon starts so the
      # inner cargo invocation is instant.
      - name: Compile Docker integration tests
        run: |
          rm -f target/nextest/docker-ci/junit.xml
          cargo nextest run --locked -p piqueld --test docker_integration --no-run
      - name: Run Docker integration tests
        run: just docker-test
      - name: Preserve Docker test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: junit-docker-integration
          path: target/nextest/docker-ci/junit.xml
          if-no-files-found: warn

  embedded-release:
    name: embedded-release
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
          cache-directories: |
            target-ui
            ${{ runner.temp }}/piqueld-tools
      - uses: ./.github/actions/dashboard-tools
        with:
          trunk-version: "0.21.14"
          tailwindcss-version: "4.3.3"
          tailwindcss-sha256: "dc61b3ac6b8c9ca874c0cc4c57b2409791a64c5540404ca5f5367360babc313a"
          binaryen-version: "132"
      - run: just build-embedded
      - run: cargo build --release --package piquelctl --locked
      - run: test -x target/release/piqueld && test -x target/release/piquelctl
      - name: Upload release binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: piqueld-binaries
          if-no-files-found: error
          path: |
            target/release/piqueld
            target/release/piquelctl
            config/piqueld.example.toml

  nix:
    name: nix (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: blacksmith-32vcpu-ubuntu-2404
          - system: aarch64-linux
            runner: blacksmith-32vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prepare local build directory
        run: sudo install -d -m 0755 /var/lib/nix-builds
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          start-daemon: false
          extra-conf: |
            build-dir = /var/lib/nix-builds
      - name: Mount persistent Nix store
        uses: useblacksmith/stickydisk@25e27b93b68733b532d9af6b201df28ffaf7dbfc # v1
        with:
          key: piqueld-nix-${{ matrix.system }}-${{ github.ref }}
          path: /nix-cache
      - name: Check persistent store
        id: nix_cache
        shell: bash
        run: |
          if sudo test -f /nix-cache/var/nix/db/db.sqlite; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Start Nix for cold-cache seeding
        if: steps.nix_cache.outputs.hit != 'true'
        run: sudo systemctl start nix-daemon.socket nix-daemon.service
      # Seed a new disk from the existing archive cache once. Warm jobs mount
      # the store directly, avoiding archive transfer and toolchain downloads.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        if: steps.nix_cache.outputs.hit != 'true'
        with:
          primary-key: nix-${{ matrix.system }}-${{ hashFiles('flake.lock', '**/Cargo.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-prefixes-first-match: |
            nix-${{ matrix.system }}-${{ hashFiles('flake.lock', '**/Cargo.toml', 'Cargo.lock') }}-
            nix-${{ matrix.system }}-
          save: false
      - name: Activate persistent Nix store
        id: nix_mount
        shell: bash
        run: |
          sudo systemctl stop nix-daemon.socket nix-daemon.service
          runtime=$(readlink -f /nix/var/nix/profiles/default/bin/nix)
          runtime=${runtime%/bin/nix}
          if ! sudo test -f /nix-cache/var/nix/db/db.sqlite \
            || ! sudo test -e "/nix-cache/store/${runtime##*/}"; then
            sudo env NIX_REMOTE=local /nix/var/nix/profiles/default/bin/nix-store \
              --dump-db | tee "$RUNNER_TEMP/nix-bootstrap.db" > /dev/null
            sudo mkdir -p /nix-cache/store
            # Store paths are immutable: skip existing directories entirely.
            for path in /nix/store/*; do
              if ! sudo test -e "/nix-cache/store/${path##*/}"; then
                sudo cp -a "$path" /nix-cache/store/
              fi
            done
            sudo rsync -a --ignore-existing --exclude=/nix/db /nix/var/ /nix-cache/var/
            sudo mkdir -p /nix-cache/var/nix/db
            # Keep the freshly installed runtime after an installer update.
            sudo cp -a /nix/var/nix/profiles/default* /nix-cache/var/nix/profiles/
          fi
          sudo chown root:root /nix-cache
          sudo mount --bind /nix-cache /nix
          echo "bound=true" >> "$GITHUB_OUTPUT"
          if [[ -f "$RUNNER_TEMP/nix-bootstrap.db" ]]; then
            cat "$RUNNER_TEMP/nix-bootstrap.db" | sudo env NIX_REMOTE=local \
              /nix/var/nix/profiles/default/bin/nix-store --load-db
          fi
          sudo systemctl start nix-daemon.socket nix-daemon.service
      - name: Evaluate every flake output
        run: nix flake show --all-systems
      # The CI wrapper retains workspace artifacts as well as dependencies,
      # and lets the VM overlap with the remaining package builds and tests.
      - name: Validate native packages and sandboxed checks
        shell: bash
        run: |
          nix build -L --impure --file nix/ci.nix \
            --argstr source "git+file://$PWD?shallow=1" \
            --argstr system "${{ matrix.system }}" \
            --out-link result-ci
          jq -n \
            --arg cli "$(readlink -f result-ci/cli-artifacts)" \
            --arg daemon "$(readlink -f result-ci/daemon-artifacts)" \
            --arg combined "$(readlink -f result-ci/combined-artifacts)" \
            '{cli: $cli, daemon: $daemon, combined: $combined}' \
            | sudo tee /nix/var/piqueld-artifacts.json > /dev/null
      - name: Release persistent Nix store
        if: always() && steps.nix_mount.outputs.bound == 'true'
        shell: bash
        run: |
          # Reclaim old outputs only when needed; retain the hot toolchain on
          # ordinary runs instead of downloading it again after every GC.
          if [[ "${{ job.status }}" == success ]]; then
            used=$(df -B1 --output=used /nix-cache | tail -n1)
            if (( used > 34359738368 )); then
              nix store gc --max "$((used - 17179869184))"
            fi
          fi
          sudo systemctl stop nix-daemon.socket nix-daemon.service
          sudo umount /nix
          # Installer cleanup uses its original store after the cache unmounts.
          sudo systemctl start nix-daemon.socket nix-daemon.service
