# Continuous integration for piqueld.
#
# Jobs group the `just` validation recipes by what they compile, so each
# compilation happens once per job instead of once per recipe:
#
#   checks  -> fmt-check, deny
#   rust    -> lint, test, doc-test, openapi-check, boundary
#   msrv    -> the published crates on the Rust their `rust-version` names
#   wasm-ui -> ui-check, check-wasm, test-wasm
#   docker-integration -> docker-test, in three shards
#   browser-playwright -> test-playwright
#   cli (macOS)        -> validate-cli
#   docs               -> docs
#
# Release builds (Nix packages, publish --dry-run, dist and install.sh) take
# too long to gate merges: release-checks.yml runs them after merging.
#
# Pull requests run only the jobs whose inputs changed (see `changes`). Draft
# pull requests run only the quick jobs (checks, rust, msrv, wasm-ui): the slower
# ones (Docker, Playwright, macOS) wait until the pull request is marked
# ready, so iterating on a draft stays cheap. `docs` runs on every pull
# request, as its links point all over the repository and any change can
# break one. Merge queue entries run every job but macOS: the queue tests
# each pull request on top of the latest main before it merges, and macOS
# runners are scarce enough to hold up the queue. The commit the queue tested
# is the one that lands, so pushes to main don't run CI again. Nightly and
# manual runs on main run everything, macOS included.
# `ci` is the single status to require: it fails if any job failed and passes
# when the rest succeeded or were skipped.
#
# Caches are saved from main only, by the nightly run. The small prebuilt
# dashboard (.github/actions/dashboard) is also saved by pull requests, and on
# main by dashboard-cache.yml after each merge that changes it. Pull requests
# and the merge queue restore main's caches, so a branch never evicts them
# with copies no other branch can read. While the nightly run fails, the
# `report` job keeps an issue open.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  # Refreshes main's caches, and runs the macOS job the queue leaves out.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts only bloat CI caches; restored dependency builds
  # make up for the lost reuse.
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: short
  NEXTEST_PROFILE: ci

jobs:
  # Decides which jobs a pull request needs from the paths it changes, and
  # holds the slow ones back while it is a draft. Each filter lists a job's
  # inputs, following the workspace dependency graph: piqueld-core <-
  # piqueld-client <- piquelctl, piqueld-ui, xtask, and the daemon embeds
  # piqueld-ui. Workspace-wide inputs run everything.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
      deny: ${{ github.event_name != 'pull_request' || steps.filter.outputs.deny == 'true' }}
      ui: ${{ github.event_name != 'pull_request' || steps.filter.outputs.ui == 'true' }}
      cli: ${{ (github.event_name != 'pull_request' && github.event_name != 'merge_group') || (steps.filter.outputs.cli == 'true' && !github.event.pull_request.draft) }}
      docker: ${{ github.event_name != 'pull_request' || (steps.filter.outputs.docker == 'true' && !github.event.pull_request.draft) }}
      playwright: ${{ github.event_name != 'pull_request' || (steps.filter.outputs.playwright == 'true' && !github.event.pull_request.draft) }}
    steps:
      - if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            workspace: &workspace
              - .github/workflows/**
              - .github/actions/**
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - .cargo/**
              - .config/**
              - justfile
            crates: &crates
              - *workspace
              - crates/**
            rust:
              - *crates
              - apps/**
              - tools/**
              - examples/**
              # A piqueld-core test loads piqueld.dev's manifest and its files.
              - deploy/**
              - .sqlx/**
              - rustfmt.toml
              # Generated by openapi-check.
              - docs/**/*.json
              - docs/user/reference/cli-commands.md
              - docs/user/reference/configuration-settings.md
              - docs/user/reference/manifest-settings.md
            deny:
              - *workspace
              - deny.toml
              - '**/Cargo.toml'
            ui:
              - *crates
              - apps/piqueld-ui/**
              - scripts/install-wasm-tools.sh
            cli:
              - *crates
              - apps/piquelctl/**
            docker:
              - *crates
              - apps/piqueld/**
              - tools/**
              - examples/**
              - scripts/**
            playwright:
              - *crates
              - apps/**
              - tools/**
              - examples/**
              - tests/playwright/**
              # The screenshot specs follow the guides.
              - docs/user/**
              - docs/images/**

  checks:
    name: checks
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.deny == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: just,cargo-deny
      - run: just fmt-check
      - run: just deny

  # Clippy runs first so lint failures report early. Both it and the tests
  # embed the prebuilt dashboard instead of compiling it. `just lint` also
  # lints the dashboard and client as wasm32, using the target from
  # rust-toolchain.toml.
  rust:
    name: rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: just,cargo-nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-directories: target-ui
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/dashboard
      - run: just lint
      - run: just test
      - name: Preserve test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: junit-workspace
          path: target/nextest/ci/junit.xml
          retention-days: 7
          if-no-files-found: ignore
      - run: just doc-test
      - run: just openapi-check
      - run: just boundary

  # Builds the published crates, as `cargo install` and their dependents do,
  # with the oldest Rust the workspace's `rust-version` promises. Warnings
  # aren't errors here: lints differ between Rust versions, and `rust` lints
  # with the pinned one.
  msrv:
    name: msrv
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # RUSTUP_TOOLCHAIN overrides rust-toolchain.toml for every later step,
      # including the cache key and the daemon build script's nested build.
      - name: Install the minimum supported Rust
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal --target x86_64-unknown-linux-musl
          echo "RUSTUP_TOOLCHAIN=$msrv" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-directories: target-probe
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --locked --package piqueld --package piquelctl --package piqueld-client

  wasm-ui:
    name: wasm-ui
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-directories: ${{ runner.temp }}/piqueld-tools
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: bash scripts/install-wasm-tools.sh
      - run: just ui-check
      - run: just check-wasm
      # Ubuntu runners ship a matching Chrome and ChromeDriver pair.
      - name: Run browser transport tests
        run: CHROMEDRIVER="${CHROMEWEBDRIVER:?}/chromedriver" just test-wasm

  # Three shards, each against an engine of its own, so the serial suites run
  # side by side: the ingress suite, and the engine suite in two halves.
  # Each compiles only the test binary it runs.
  docker-integration:
    name: docker-integration (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ingress
            suite: ingress
            binary: --lib
          - name: engine 1/2
            suite: engine
            binary: --test docker_integration
            partition: --partition count:1/2
          - name: engine 2/2
            suite: engine
            binary: --test docker_integration
            partition: --partition count:2/2
    env:
      # `just docker-test` bounds each test run, within the job's timeout so
      # its cleanup and the test report still run; compilation is already
      # warm through the prebuild below.
      PIQUELD_DOCKER_TEST_TIMEOUT: 20m
      NEXTEST_PROFILE: docker-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: just,cargo-nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.suite }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Compile everything `just docker-test` runs before the isolated
      # Docker-in-Docker daemon starts, so its inner cargo invocations are
      # instant: the xtask runner and the shard's test binary.
      - name: Compile Docker integration tests
        run: |
          cargo build --locked --package xtask
          cargo nextest run --locked -p piqueld ${{ matrix.binary }} --no-run
      - name: Run Docker integration tests
        run: just docker-test ${{ matrix.suite }} ${{ matrix.partition }}
      - name: Preserve test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: junit-docker-integration-${{ strategy.job-index }}
          path: target/nextest/docker-ci/junit.xml
          retention-days: 7
          if-no-files-found: ignore

  browser-playwright:
    name: browser-playwright
    needs: changes
    if: needs.changes.outputs.playwright == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-directories: target-ui
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/dashboard
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install pinned pnpm locally
        run: |
          npm install --prefix "$RUNNER_TEMP/piqueld-playwright-tools" pnpm@12.3.4
          echo "$RUNNER_TEMP/piqueld-playwright-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - run: just setup-playwright
      - run: pnpm --dir tests/playwright audit --audit-level=moderate
      - run: just test-playwright
      - name: Check documentation screenshots
        run: just docs-screenshots --update-snapshots=none
      - name: Preserve browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-playwright-report
          path: |
            tests/playwright/playwright-report/
            tests/playwright/test-results/
          retention-days: 7
          if-no-files-found: warn

  macos-cli:
    name: cli (macOS)
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: just,cargo-nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: just validate-cli

  # Builds the documentation book and checks its links. The flake's `docs`
  # shell provides the tools at the versions flake.lock pins, as in
  # `nix develop`.
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nothing here pushes or fetches with the token.
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - run: nix develop .#docs --command just docs

  ci:
    name: ci
    if: always()
    needs:
      - changes
      - checks
      - rust
      - msrv
      - wasm-ui
      - docker-integration
      - browser-playwright
      - macos-cli
      - docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: checks, rust, msrv, wasm-ui, docker-integration, browser-playwright, macos-cli
          jobs: ${{ toJSON(needs) }}

  # The nightly run is the only one after merging, and the only one with macOS
  # once a pull request is queued, so its failures keep an issue open.
  report:
    name: report
    needs: ci
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - uses: ./.github/actions/report
        with:
          title: Nightly CI fails on main
          failed: ${{ needs.ci.result != 'success' }}
