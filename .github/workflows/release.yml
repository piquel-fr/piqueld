# Creates the GitHub release of a version when `just release` pushes its tag,
# such as v0.1.0, with the static release archive install.sh installs and its
# checksums. gh creates the release as a draft, uploads the files, then
# publishes it, so the latest release always has its archive. Its notes list
# the pull requests merged since the previous release. See
# docs/dev/releasing.md.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# As in CI: rust-cache's key hashes the CARGO*, RUST* and CC* variables, so the
# build restores the cache of the CI install job only while they match.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: short

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # Creates the release.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check that the tag is the workspace version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "::error::the tag $GITHUB_REF_NAME isn't the workspace version, $version"
            exit 1
          }
      - run: sudo apt-get update -qq && sudo apt-get install --yes --no-install-recommends musl-tools
      # The CI install job's build on main, which saves this cache.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: dist
          save-if: false
      - run: cargo xtask dist
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "piqueld ${GITHUB_REF_NAME#v}" --generate-notes target/dist/*
