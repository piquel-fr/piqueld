# Publishes a release when a version tag, such as `v0.1.0`, is pushed: the
# crates to crates.io, then a GitHub release with the version's changelog
# entry. See docs/dev/releasing.md.
#
# The `crates-io` environment holds the `CARGO_REGISTRY_TOKEN` secret, a
# crates.io API token scoped to publishing the piqueld crates.

name: Release

on:
  push:
    tags: ["v*"]

# A release runs to completion: cancelling it halfway would leave some crates
# published and others not.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: crates-io
    permissions:
      # Creates the GitHub release.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check the tag and changelog
        id: version
        run: |
          version=$(cargo pkgid --package piqueld | sed 's/.*[#@]//')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::the tag $GITHUB_REF_NAME doesn't match the workspace version $version"
            exit 1
          fi
          # The entry under `## <version>`, up to the next version's heading.
          awk -v heading="## $version" \
            'index($0, heading) == 1 { found = 1; next } /^## / { found = 0 } found' \
            CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no entry for $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish the crates
        run: cargo xtask publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Create the GitHub release
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "piqueld ${{ steps.version.outputs.version }}" \
            --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
