api_version = "piqueld.dev/v1alpha1"
kind = "Application"

[metadata]
name = "qualified-git"

[[spec.services]]
name = "web"
replicas = 2
ports = [8080]

[spec.services.source]
type = "git"
# Replace this documentation-only repository with an HTTPS fixture repository
# owned by the qualification environment.
repository = "https://example.invalid/piqueld-qualification-app.git"
reference = "main"
context = "."
dockerfile = "Dockerfile"

[spec.services.environment]
APP_MODE = "qualification"

[spec.services.healthcheck]
type = "http"
port = 8080
path = "/health"
interval_seconds = 5
timeout_seconds = 2

[[spec.routes]]
host = "qualified-git.example.test"
service = "web"
port = 8080
